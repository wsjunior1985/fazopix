name: Build and deploy Faz o PIX

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fazopix-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fazopix
          cache-to: type=gha,mode=max,scope=fazopix

      - name: Trigger Coolify deployment
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_WEBHOOK_SECRET"
          payload_file="$(mktemp)"
          trap 'rm -f "$payload_file"' EXIT
          python3 - <<'PY' > "$payload_file"
          import json
          import os

          sha = os.environ["GITHUB_SHA"]
          print(json.dumps({
              "ref": "refs/heads/main",
              "after": sha,
              "repository": {"full_name": os.environ["GITHUB_REPOSITORY"]},
              "commits": [{
                  "id": sha,
                  "message": "Deploy image built by GitHub Actions",
                  "added": [],
                  "removed": [],
                  "modified": ["Dockerfile"],
              }],
          }))
          PY
          signature="$(openssl dgst -sha256 -hmac "$COOLIFY_WEBHOOK_SECRET" "$payload_file" | awk '{print $2}')"
          response="$(curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 2 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --data-binary "@$payload_file" \
            https://coolify.waldeapps.systems/webhooks/source/github/events/manual)"
          printf '%s\n' "$response"
          printf '%s' "$response" | python3 -c 'import json,sys; payload=json.load(sys.stdin); assert payload and payload[0].get("status")=="success", payload'
