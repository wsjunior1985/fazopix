    <script>
      (function () {
        try {
          var raw = localStorage.getItem('fazopix.theme.v2');
          var saved = raw ? JSON.parse(raw) : null;
          var t = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', t === 'dark' ? '#0f1113' : '#f4f5f6');
        } catch (e) {}
      })();
