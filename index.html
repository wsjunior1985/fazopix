<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Crie seu QR Code Pix em poucos passos. Sem cadastro: gere, copie, compartilhe ou imprima direto no seu aparelho." />
    <link rel="icon" href="/favicon.png?v=2" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <title>Faz o PIX! — QR Pix em poucos passos</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('fazopix.theme.v2');
          var saved = raw ? JSON.parse(raw) : null;
          var t = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', t === 'dark' ? '#0f1113' : '#f4f5f6');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
